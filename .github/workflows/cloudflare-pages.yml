# 可选：GitHub Actions 工作流（如果不想使用 Cloudflare 的自动构建）
# 注意：Cloudflare Pages 通常会自动检测 GitHub 仓库并构建，此文件为可选
# 
# 如果你已经在 Cloudflare Dashboard 中连接了 GitHub 仓库，
# 那么 Cloudflare 会自动处理部署，这个工作流不是必需的。
# 
# 只有在以下情况才需要这个工作流：
# 1. 想要在 GitHub Actions 中构建（而不是 Cloudflare 构建）
# 2. 需要更复杂的构建流程
# 3. 想要在部署前运行测试

name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: byvibe-studio-public
          directory: out
